name: Weekly Stage 2-4 Analysis

on:
  workflow_dispatch:
  schedule:
    # Saturday 8:00 PM PST = Sunday 04:00 UTC.
    - cron: "0 4 * * 0"

permissions:
  actions: read
  contents: write

jobs:
  stage2_stage4:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_SENTIMENT_MODEL: ${{ vars.XAI_SENTIMENT_MODEL || 'grok-4.3' }}
      MAX_WORKERS: "5"
      SHORTLIST_MIN_SCORE: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Download latest Stage 1 state
        run: |
          run_id="$(gh run list \
            --workflow weekly-stage1.yml \
            --branch "${GITHUB_REF_NAME}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful Stage 1 workflow run found. Run Weekly Stage 1 Universe first."
            exit 1
          fi
          gh run download "$run_id" --name stage1-state --dir .

      - name: Prepare report run directory
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          epoch="$(date -u +%s)"
          reverse_epoch="$(printf '%010d' "$((9999999999 - epoch))")"
          report_dir="reports/${reverse_epoch}_${timestamp}"
          echo "REPORT_RUN_DIR=${report_dir}" >> "$GITHUB_ENV"
          echo "REPORT_RUN_NAME=${timestamp}" >> "$GITHUB_ENV"
          mkdir -p "${report_dir}"

      - name: Run Stage 2-4 from cached Stage 1
        run: |
          python -m deep_stock_analysis.cli \
            --stage stage1-stage4 \
            --use-cached-stage1 \
            --state-path pipeline_state.db \
            --reports-dir "${REPORT_RUN_DIR}" \
            --shortlist-min-score 30 \
            --max-sentiment-candidates 50 \
            --max-index 20 \
            --progress-every 250

      - name: Update reports index
        run: |
          {
            echo "# Scheduled Report Runs"
            echo
            echo "Newest runs are listed first. Open a run folder and start with \`index.md\`."
            echo
            find reports -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | sort | while read -r dir; do
              name="$(basename "${dir}")"
              timestamp="${name#*_}"
              echo "- [${timestamp}](${dir}/index.md)"
            done
          } > reports/README.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-reports-${{ env.REPORT_RUN_NAME }}
          path: ${{ env.REPORT_RUN_DIR }}
          retention-days: 30

      - name: Commit scheduled reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/README.md "${REPORT_RUN_DIR}"
          if git diff --cached --quiet; then
            echo "No scheduled report changes to commit."
            exit 0
          fi
          git commit -m "Add scheduled stock reports ${REPORT_RUN_NAME}"
          git push

      - name: Upload updated pipeline state
        uses: actions/upload-artifact@v4
        with:
          name: stage2-stage4-state
          path: pipeline_state.db
          retention-days: 30
